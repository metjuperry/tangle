query Prs($q: String!, $after: String) {
  search(type: ISSUE, query: $q, first: 50, after: $after) {
    issueCount
    pageInfo { hasNextPage endCursor }
    nodes { ... on PullRequest {
      id number title body url isDraft state createdAt updatedAt closedAt
      author { login } repository { nameWithOwner }
      headRefName baseRefName mergeable mergeStateStatus reviewDecision
      additions deletions changedFiles
      files(first: 100) {
        pageInfo { hasNextPage endCursor }
        nodes { path }
      }
      reviewRequests(first: 100) {
        pageInfo { hasNextPage endCursor }
        nodes { requestedReviewer { __typename ... on User { login } ... on Team { slug } } }
      }
      reviewThreads(first: 100) {
        pageInfo { hasNextPage endCursor }
        nodes { id isResolved path
          comments(last: 1) { nodes { author { login } createdAt bodyText } }
        }
      }
      commits(last: 1) {
        nodes { commit { committedDate message author { user { login } }
          statusCheckRollup { state } } }
      }
      timelineItems(last: 30, itemTypes: [ISSUE_COMMENT, PULL_REQUEST_REVIEW, REVIEW_REQUESTED_EVENT, PULL_REQUEST_COMMIT]) {
        pageInfo { hasPreviousPage startCursor }
        nodes {
          __typename
          ... on IssueComment { createdAt author { login } body }
          ... on PullRequestReview { createdAt submittedAt author { login } body state }
          ... on ReviewRequestedEvent {
            createdAt actor { login }
            requestedReviewer { __typename ... on User { login } ... on Team { slug } }
          }
          ... on PullRequestCommit { commit { committedDate message author { user { login } } } }
        }
      }
    } }
  }
  rateLimit { cost remaining resetAt }
}

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: tangle-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  image:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Verify release source and CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/master
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=20" \
            --jq ".workflow_runs | any(.head_sha == \"$sha\" and .event == \"push\" and .conclusion == \"success\")" | grep -qx true || {
              echo "::error::Release tag must point to code on master with successful CI."
              exit 1
            }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sha-${{ steps.source.outputs.sha }}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Release artifact summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          echo "## Published release image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Production deployment uses this exact digest and awaits its normal safety checks/approval." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: image
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/cd.yml
    with:
      operation: apply
      deploy_application: true
      container_image: ${{ needs.image.outputs.image }}
      source_sha: ${{ needs.image.outputs.source_sha }}

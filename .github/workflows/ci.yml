name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: tangle:test
      - name: Smoke test packaged app
        run: |
          set -euo pipefail
          id=$(docker run --detach --publish 127.0.0.1:5205:8080 \
            --env Auth__Mode=GitHub \
            --env GitHub__App__ClientId=fake-client \
            --env GitHub__App__ClientSecret=fake-secret \
            --env GitHub__App__CallbackUrl=http://127.0.0.1:5205/auth/github/callback \
            --env Tangle__AllowedHosts__0=127.0.0.1:5205 \
            --env Tangle__AllowedOrigins__0=http://127.0.0.1:5205 \
            tangle:test)
          trap 'docker logs "$id"; docker rm --force "$id" >/dev/null' EXIT
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --max-time 5 \
            http://127.0.0.1:5205/healthz
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run lint && npm run build
        working-directory: web
      - run: dotnet restore --locked-mode && dotnet test --no-restore
      - run: node --test tests/hooks/session-hook.test.mjs
      - run: node docs/generate-guide.mjs --check
      - run: npx playwright install --with-deps chromium && npx playwright test
        working-directory: web
      - run: npx playwright test --config playwright.oauth.config.ts
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
